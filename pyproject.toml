[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editable-scan"
version = "1.0.0"
description = "Preserve documents and add searchable OCR text."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "indra-ocr==1.1.2",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pikepdf>=10.17",
  "Pillow>=12",
  "pypdfium2>=5",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34",
]

[project.scripts]
editable-scan = "editable_scan.web:run"

[dependency-groups]
test = ["fpdf2>=2.8.9", "httpx>=0.28", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
